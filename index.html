<body>

                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." />
                <button class="chat-button" id="chatButton">Send</button>
            </div>
            <div class="venmo-message" id="venmoMessage">my venmo is <a href="https://venmo.com/u/ryanfding" target="_blank">@ryanfding</a> btw 😛</div>
